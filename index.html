<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; padding: 0; overflow: hidden; background: #000; }
  canvas { display: block; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
</head>
<body>
<script>
let particles = [];
const W = 1080;
const H = 400;

function setup() {
  createCanvas(W, H);
  
  // إنشاء كانفاس مؤقت لرسم النص واستخراج البيكسلز
  let pg = createGraphics(W, H);
  pg.background(0);
  pg.fill(255);
  pg.textSize(220);
  pg.textAlign(CENTER, CENTER);
  pg.textStyle(BOLD);
  pg.textFont('Arial');
  pg.text('MOTION', W / 2, H / 2);
  pg.loadPixels();
  
  // استخراج نقاط النص وتحويلها لجسيمات
  let step = 5; // كثافة النقاط (أصغر = نقاط أكتر)
  for (let y = 0; y < H; y += step) {
    for (let x = 0; x < W; x += step) {
      let index = (x + y * W) * 4;
      if (pg.pixels[index] > 128) {
        particles.push(new Particle(x, y));
      }
    }
  }
}

function draw() {
  background(0, 40); // خلفية سوداء مع trail خفيف
  
  for (let p of particles) {
    p.update();
    p.show();
  }
}

class Particle {
  constructor(x, y) {
    this.homeX = x;
    this.homeY = y;
    this.x = x;
    this.y = y;
    this.vx = 0;
    this.vy = 0;
    this.size = random(1.5, 2.8);
    this.offset = random(1000); // لتنويع حركة الموجة
  }
  
  update() {
    // حركة الموجة الطبيعية (waves)
    let waveX = sin(frameCount * 0.02 + this.offset) * 1.5;
    let waveY = cos(frameCount * 0.02 + this.offset * 0.5) * 1.5;
    
    // التفاعل مع المؤشر - تبعثر النقاط
    let dx = this.x - mouseX;
    let dy = this.y - mouseY;
    let dist = sqrt(dx * dx + dy * dy);
    let repelRadius = 80;
    
    if (dist < repelRadius && dist > 0) {
      let force = (repelRadius - dist) / repelRadius;
      this.vx += (dx / dist) * force * 2;
      this.vy += (dy / dist) * force * 2;
    }
    
    // قوة الرجوع للمكان الأصلي
    let returnX = (this.homeX - this.x) * 0.05;
    let returnY = (this.homeY - this.y) * 0.05;
    this.vx += returnX;
    this.vy += returnY;
    
    // الاحتكاك (friction)
    this.vx *= 0.9;
    this.vy *= 0.9;
    
    // تطبيق الحركة
    this.x += this.vx + waveX * 0.3;
    this.y += this.vy + waveY * 0.3;
  }
  
  show() {
    noStroke();
    fill(255);
    circle(this.x, this.y, this.size);
  }
}
</script>
</body>
</html>
