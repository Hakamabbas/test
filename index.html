<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MOTION</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { 
    width: 100%; 
    height: 100vh; 
    overflow: hidden; 
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  canvas { display: block; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
</head>
<body>
<script>
let particles = [];
const W = 1080;
const H = 400;
let myFont;

function preload() {
  // تحميل خط من Google Fonts عشان نضمن إنه جاهز
  myFont = loadFont('https://fonts.gstatic.com/s/opensans/v34/mem8YaGs126MiZpBA-U1UpcaXcl0Aw.ttf');
}

function setup() {
  createCanvas(W, H);
  background(0);
  
  // رسم النص مباشرة على الكانفاس الرئيسي أولاً
  pixelDensity(1);
  background(0);
  fill(255);
  noStroke();
  textFont(myFont);
  textSize(220);
  textAlign(CENTER, CENTER);
  textStyle(BOLD);
  text('MOTION', W / 2, H / 2);
  
  // قراءة البكسلز من الكانفاس مباشرة
  loadPixels();
  
  let step = 5;
  for (let y = 0; y < H; y += step) {
    for (let x = 0; x < W; x += step) {
      let index = (x + y * W) * 4;
      if (pixels[index] > 128) {
        particles.push(new Particle(x, y));
      }
    }
  }
  
  console.log('عدد النقاط المتولدة:', particles.length);
  
  // مسح الكانفاس بعد استخراج النقاط
  background(0);
}

function draw() {
  background(0, 40);
  
  for (let p of particles) {
    p.update();
    p.show();
  }
}

class Particle {
  constructor(x, y) {
    this.homeX = x;
    this.homeY = y;
    this.x = x + random(-10, 10);
    this.y = y + random(-10, 10);
    this.vx = 0;
    this.vy = 0;
    this.size = random(1.5, 2.8);
    this.offset = random(1000);
  }
  
  update() {
    let waveX = sin(frameCount * 0.02 + this.offset) * 1.5;
    let waveY = cos(frameCount * 0.02 + this.offset * 0.5) * 1.5;
    
    let dx = this.x - mouseX;
    let dy = this.y - mouseY;
    let dist = sqrt(dx * dx + dy * dy);
    let repelRadius = 80;
    
    if (dist < repelRadius && dist > 0) {
      let force = (repelRadius - dist) / repelRadius;
      this.vx += (dx / dist) * force * 2;
      this.vy += (dy / dist) * force * 2;
    }
    
    this.vx += (this.homeX - this.x) * 0.05;
    this.vy += (this.homeY - this.y) * 0.05;
    this.vx *= 0.9;
    this.vy *= 0.9;
    
    this.x += this.vx + waveX * 0.3;
    this.y += this.vy + waveY * 0.3;
  }
  
  show() {
    noStroke();
    fill(255);
    circle(this.x, this.y, this.size);
  }
}
</script>
</body>
</html>
